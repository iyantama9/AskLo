server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=30s;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml application/wasm;
    gzip_disable "msie6";

    # Flutter web output is NOT content-hashed (main.dart.js keeps the same name
    # across builds), so every entry point must revalidate on each load.
    # "no-cache" still allows ETag/Last-Modified 304s, so repeat visits stay cheap.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sw-cleanup.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Admin is part of the Flutter app, not a separate static page.
    # Deep links (/admin, /admin/models, ...) all resolve to the SPA.

    # ^~ so the image/font regex below can never capture files under /assets/;
    # asset names are not fingerprinted either, so they must revalidate too.
    location ^~ /assets/ {
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # Deferred dart2js parts and wasm entrypoints share the un-hashed-name
    # problem; deploys version them with ?v=, revalidation is the safety net.
    # nginx's default mime.types has no .mjs mapping and browsers enforce
    # strict MIME checks on ES modules, so declare types explicitly here.
    location ~* \.(part\.js|mjs|wasm)$ {
        types {
            text/javascript js mjs;
            application/wasm wasm;
        }
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # Only changes when the Flutter SDK is upgraded.
    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Root-level images/fonts (favicon, icons/). 7 days, no "immutable" —
    # immutable is only safe for content-hashed filenames.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location ^~ /api/ {
        set $backend_upstream http://backend:4001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
